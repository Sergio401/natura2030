# NATURA 2030 — dev preview reverse proxy (agent change pipeline).
# Proxies to the Astro Node server running the `dev` branch worktree,
# managed by pm2 as `natura-dev`. See docs/AGENT_CONTRACT.md.
#
# Install on the VPS:
#   sudo cp ~/code/natura2030/web/deploy/nginx/natura-dev.conf /etc/nginx/sites-available/natura-dev
#   sudo ln -sf /etc/nginx/sites-available/natura-dev /etc/nginx/sites-enabled/natura-dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (free, no signup — sslip.io resolves *.sslip.io to the embedded IP):
#   sudo apt install -y certbot python3-certbot-nginx   # already installed for zeta/natura
#   sudo certbot --nginx -d dev.natura.2-25-153-144.sslip.io --redirect
# certbot rewrites this file to add the :443 block and an http->https redirect.
# Swap server_name for a real domain later and re-run certbot with -d that.

server {

    server_name dev.natura.2-25-153-144.sslip.io;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/admin/chat calls an LLM and can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    listen 80;
    listen [::]:80;
}
